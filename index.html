<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="اختار: نشيط ولا كسول؟ وهنوجهك للموقع المناسب.">
    <meta name="theme-color" content="#0f172a">
    <title>نشيط ولا كسول؟</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #f8fafc;
            padding: 20px;
            text-align: center;
        }

        .intro { max-width: 480px; margin-bottom: 40px; }
        .intro h1 { font-size: 1.9rem; font-weight: 700; margin-bottom: 12px; }
        .intro p { color: #94a3b8; font-size: 1.05rem; line-height: 1.7; }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 720px;
        }

        .choice {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            border-radius: 16px;
            padding: 40px 20px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            border: 1px solid transparent;
        }

        .choice:hover { transform: translateY(-4px); }

        .choice-lazy {
            background: #1e293b;
            border-color: #334155;
            color: #f8fafc;
        }
        .choice-lazy:hover { border-color: #38bdf8; box-shadow: 0 10px 30px rgba(56,189,248,0.15); }

        .choice-active {
            background: #fff7ed;
            border-color: #fed7aa;
            color: #7c2d12;
        }
        .choice-active:hover { border-color: #fb923c; box-shadow: 0 10px 30px rgba(251,146,60,0.25); }

        .choice-emoji { font-size: 3rem; }
        .choice-title { font-size: 1.3rem; font-weight: 700; }
        .choice-sub { font-size: 0.9rem; opacity: 0.75; font-family: 'Fira Code', monospace; }

        @media (max-width: 600px) {
            .choices { grid-template-columns: 1fr; }
            .intro h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <div class="intro">
        <h1>إنت النهاردة نشيط ولا مش نشيط؟</h1>
        <p>جاوب بصراحة، وهنوجهك للموقع اللي يناسب حالتك دلوقتي بالظبط.</p>
    </div>

    <div class="choices">
        <a class="choice choice-lazy" href="lazy.html">
            <span class="choice-emoji">😴</span>
            <span class="choice-title">مش نشيط، عايز أكسل</span>
            <span class="choice-sub">// فن الكسل</span>
        </a>
        <a class="choice choice-active" href="productive.html">
            <span class="choice-emoji">⚡</span>
            <span class="choice-title">نشيط، عايز أنجز</span>
            <span class="choice-sub">// فن الإنتاجية</span>
        </a>
    </div>

</body>
</html>
